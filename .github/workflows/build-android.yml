name: Build Android APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages & wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify Expo version
        run: node -e "const v=require('./node_modules/expo/package.json').version; console.log('expo installed:',v); if(!v.startsWith('57')) process.exit(1);"

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: '1'
          CI: '1'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK & AAB
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            echo "🚀 Gradle build attempt $attempt of 3..."
            ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
              -Pandroid.injected.signing.store.password=35e46672f6141074bc080e0d79616afd \
              -Pandroid.injected.signing.key.alias=c3e6c980534f93dc06f106f42a7e99db \
              -Pandroid.injected.signing.key.password=738acf5f9d8a76ae5ff16de2b84c459e \
              -Dorg.gradle.internal.http.connectionTimeout=120000 \
              -Dorg.gradle.internal.http.socketTimeout=120000 \
              -Dorg.gradle.internal.repository.max.tentatives=5 \
              -Dorg.gradle.internal.repository.initial.backoff=3000 \
              --no-daemon && break || {
                if [ "$attempt" -eq 3 ]; then
                  echo "❌ Build failed after 3 attempts."
                  exit 1
                fi
                echo "⚠️ Transient network/Maven timeout detected. Retrying in 10 seconds..."
                sleep 10
              }
          done
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=false -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.repository.max.tentatives=5"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kisanTeam-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kisanTeam-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
